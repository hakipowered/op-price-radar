name: Daily price update

on:
  schedule:
    # tcgcsv refreshes around 20:00 UTC; run after that.
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "watchlist.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download price history
        run: |
          mkdir -p history
          gh release download price-history --repo "$GITHUB_REPOSITORY" --dir history --pattern 'history-*.csv.gz' \
            || echo "No stored history yet."

      - name: Fetch prices and build site data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only send the Telegram digest on the scheduled daily run.
          SEND_DIGEST: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SEND_DIGEST" = "true" ]; then
            python scripts/update.py
          else
            python scripts/update.py --no-telegram
          fi

      - name: Save price history
        run: |
          gh release view price-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create price-history --repo "$GITHUB_REPOSITORY" --title "Price history" \
                 --notes "Rolling daily price history used by the site. Updated automatically. Do not delete." --latest=false
          gh release upload price-history history/history-*.csv.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove old snapshot files
        run: |
          if [ -d data/snapshots ]; then
            git config user.name "op-price-radar bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -r -q data/snapshots
            git commit -m "Move price history to release storage"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
